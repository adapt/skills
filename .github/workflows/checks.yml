name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify actions are pinned
        run: python3 skills/pin-github-actions/scripts/check_pins.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26"
      - name: Verify discovery and installation
        shell: bash
        run: |
          npx --yes skills@1.7.6 add . --list
          cd "$(mktemp -d)"
          npx --yes skills@1.7.6 add "$GITHUB_WORKSPACE" --skill '*' --agent claude-code --agent codex --yes
          for source in "$GITHUB_WORKSPACE"/skills/*/SKILL.md; do
            test -f "$source"
            skill_dir="$(dirname "$source")"
            name="$(basename "$skill_dir")"
            diff -r "$skill_dir" ".claude/skills/$name"
            diff -r "$skill_dir" ".agents/skills/$name"
          done
